server:
  port: ${PORT:5000}

spring:
  application:
    name: taskflow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-rapid-grass-beep34u5-pooler.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:taskflow_jwt_secret_aniket_super_secure_key_2026_xyz}
  expiration-ms: 604800000 # 7 days

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# Swagger / OpenAPI documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
